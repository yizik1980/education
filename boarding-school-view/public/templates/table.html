<div
  class="table-responsive"
  ng-if="!loading && !error && filteredSchools.length > 0"
>
  <table class="table table-hover table-bordered align-middle mb-0">
    <thead class="table-dark">
      <tr>
        <th style="width: 60px">מזהה</th>
        <th>שם הפנימייה</th>
        <th>עיר</th>
        <th class="text-center">מספר תלמידים</th>
        <th class="text-center">גיל ממוצע</th>
      </tr>
    </thead>
    <tbody>
      <tr ng-repeat="school in filteredSchools" class="animate-row">
        <td><span class="text-muted">{{school.educationPlaceId}}</span></td>
        <td><span class="fw-bold">{{school.placeName}}</span></td>
        <td>
          <span class="badge bg-secondary">
            <i class="bi bi-geo-alt-fill me-1"></i>{{school.city || 'לא צוין'}}
          </span>
        </td>
        <td class="text-center">
          <span class="badge bg-info text-dark px-3 py-2"
            >{{school.activeStudentCount | number}}</span
          >
        </td>
        <td class="text-center fw-semibold text-primary">
          {{school.avrageAges | number:1}} <small>שנים</small>
        </td>
      </tr>
    </tbody>
    <tfoot class="table-light fw-bold">
      <tr>
        <td colspan="3" class="text-start">סיכום תוצאות מסוננות:</td>
        <td class="text-center text-success fs-5">{{totalStudents}}</td>
        <td class="text-center text-primary fs-5">
          {{globalAverageAges | number:1}} <small>שנים</small>
        </td>
      </tr>
    </tfoot>
  </table>
</div>
