<div class="row mb-4" ng-if="!error">
    <div class="col-md-6 position-relative">
        <label class="form-label fw-bold">סינון לפי עיר:</label>
        <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" 
                   class="form-control" 
                   placeholder="הקלד שם עיר לסינון..." 
                   ng-model="searchQuery" 
                   ng-change="filterByCity()"
                   list="cityList">
            <datalist id="cityList">
                <option ng-repeat="city in citySuggestions" value="{{city}}">
            </datalist>
        </div>
        <div class="form-text">הנתונים בטבלה יתעדכנו אוטומטית לפי העיר שתבחר.</div>
    </div>
</div>
