<!DOCTYPE html>
<html lang="he" dir="rtl" ng-app="boardingSchoolApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מבט על פנימיות</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .animate-row { transition: all 0.3s ease; }
        .badge { font-weight: 500; }
        .toast-item { transition: opacity 0.4s ease, transform 0.4s ease; opacity: 1; transform: translateY(0); }
        .toast-item.ng-hide { opacity: 0; transform: translateY(12px); }
        .toast-item.ng-hide-add, .toast-item.ng-hide-remove { display: block !important; }
    </style>
</head>
<body ng-controller="MainController" class="bg-light">
    <div class="container py-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h1 class="h3 mb-0"><i class="bi bi-building"></i> לוח בקרה - פנימיות</h1>
                <button class="btn btn-outline-light btn-sm" ng-click="retry()" ng-disabled="loading">
                    <i class="bi bi-arrow-clockwise" ng-class="{'spin': loading}"></i> רענן נתונים
                </button>
            </div>
            <div class="card-body">
                <!-- Search Box Template -->
                <div ng-include="'templates/search-box.html'"></div>

                <!-- Status Messages Template (Loading, Error, No Results) -->
                <div ng-include="'templates/status.html'"></div>
                
                <!-- Data Table Template -->
                <div ng-include="'templates/table.html'"></div>

                <!-- Students Panel (shown when a school row is selected) -->
                <div ng-include="'templates/students.html'"></div>
            </div>
        </div>
    </div>
    
    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999">
        <div ng-repeat="toast in toasts" class="toast-item toast show align-items-center border-0 mb-2"
             ng-class="toast.type === 'success' ? 'text-bg-success' : 'text-bg-danger'"
             ng-show="toast.visible">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center gap-2">
                    <i ng-if="toast.type === 'success'" class="bi bi-check-circle-fill"></i>
                    <i ng-if="toast.type === 'error'" class="bi bi-exclamation-triangle-fill"></i>
                    {{toast.message}}
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto"
                        ng-click="dismissToast(toast)"></button>
            </div>
        </div>
    </div>

    <script src="dist/bundle.js"></script>
</body>
</html>
